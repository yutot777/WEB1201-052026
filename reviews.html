<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- DONT TOUCH OR MOBILE UI DIES -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews - Music App</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reviews.css">
</head>

<body>

<!-- ==========================
     GLOBAL HEADER & NAVIGATION
     ==========================-->
<header>
    <div class="logo">
        <a href="index.html">insert logo (click to go home)</a>
    </div>

    <!-- hamburger button for mobile -->
    <button id="mobile-menu-button" aria-label="opens nav menu">☰</button>

    <!-- navigation links -->
    <nav id="nav-links">
        <a href="index.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="reviews.html" class="active">Reviews</a>
        <a href="team.html">Team</a>

        <!-- dark mode toggle and profile button -->
        <div class="nav-actions">
            <button id="toggle-theme-button" aria-label="toggle dark or light mode">MOON/SUN</button>
            <a href="register.html" id="nav-login-button">LOGIN/REGISTER</a>
        </div>
    </nav>
</header>

<!-- =================
     MAIN CONTENT AREA
     =================-->
<main id="main-content">

    <section class="reviews-section">
        
        <!-- Review Submission Form -->
        <div class="review-form-container">
            <h2>Leave a Review</h2>

            <!-- Warning banner when user is not logged in -->
            <div id="login-warning" class="login-warning hidden">
                <p>⚠️ You are currently posting as a <strong>Guest</strong>. Please <a href="register.html">Log In or Register</a> to link reviews to your account.</p>
            </div>

            <form id="review-form">
                <!-- User account indicator -->
                <div class="form-group">
                    <label>Posting as:</label>
                    <input type="text" id="review-user-display" value="Guest" disabled>
                </div>

                <!-- 5-Star Rating Selection -->
                <div class="form-group">
                    <label>Rating *</label>
                    <div class="star-rating" id="star-rating-container">
                        <span class="star" data-value="1">&#9733;</span>
                        <span class="star" data-value="2">&#9733;</span>
                        <span class="star" data-value="3">&#9733;</span>
                        <span class="star" data-value="4">&#9733;</span>
                        <span class="star" data-value="5">&#9733;</span>
                    </div>
                    <span class="error-message" id="err-rating"></span>
                </div>

                <!-- Review Textarea -->
                <div class="form-group">
                    <label for="review-text">Your Feedback *</label>
                    <textarea id="review-text" rows="4" maxlength="300" placeholder="Write your thoughts here..."></textarea>
                    <div class="char-count-wrapper">
                        <span id="char-counter">0 / 300</span>
                    </div>
                    <span class="error-message" id="err-text"></span>
                </div>

                <button type="submit" class="btn btn-submit" id="submit-review-btn">Submit Review</button>
            </form>
        </div>

        <!-- Past Reviews Feed -->
        <div class="reviews-feed-container">
            <h2>Community Reviews</h2>
            <div id="reviews-list" class="reviews-list">
                <!-- Dynamic review cards appended here -->
            </div>
        </div>

    </section>

</main>

<!-- ==========================
     FOOTER SAME FOR EVERY PAGE
     ========================== -->
<footer>
    <p>&copy; 2026 music app. we own all rights.</p>
</footer>

<!-- JAVASCRIPT SCRIPTS -->
<script src="js/reviews.js"></script>

</body>
</html>
